name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Typecheck server
        run: npx tsc -p server/tsconfig.json --noEmit

      - name: Typecheck SPA
        run: npx tsc -p tsconfig.json --noEmit

      - name: Run tests
        run: npm test

      - name: Dependency vulnerability scan (production dependencies)
        # Report-only: does not fail the build. Scoped to production deps so
        # it reflects what's actually shipped, not desktop/mobile build
        # tooling. Review output manually; see AI_PROJECT_OS/52_COMPLIANCE.md
        # (SOC 2 CC4/CC7) for the triage process.
        run: npm audit --omit=dev || true
